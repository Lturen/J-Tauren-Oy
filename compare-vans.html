<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<title>Van-mallien vertailu</title>
<style>
body { margin:0; font-family:Segoe UI,Arial; background:#eef4fb; }
.grid { display:grid; grid-template-columns:1fr 1fr; }
.cell { position:relative; height:48vh; border:1px solid #ccd; }
.cell span { position:absolute; top:6px; left:8px; z-index:2; font-weight:700; color:#1b3a6b; background:rgba(255,255,255,.8); padding:2px 8px; border-radius:6px; font-size:13px; }
canvas { width:100%; height:100%; display:block; }
</style>
</head>
<body>
<div class="grid">
  <div class="cell"><span>A: 43472d7d (Poly/Google)</span><canvas data-src="van_43472d7d-283d-48be-991e-698440dea10f.glb"></canvas></div>
  <div class="cell"><span>B: e573341b (Poly/Google)</span><canvas data-src="van_e573341b-c2f3-4cc5-b0e9-73b293725b63.glb"></canvas></div>
  <div class="cell"><span>C: 3f2dc62d (jeremy)</span><canvas data-src="van_3f2dc62d-0f61-4bfc-bb36-5bf5c7d70305.glb"></canvas></div>
  <div class="cell"><span>D: 233b6797 (Generic Van)</span><canvas data-src="van_233b6797-9ce6-4369-8458-0b7fe16444ef.glb"></canvas></div>
</div>
<script>
window.status = "loading";
Promise.all([
  import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js'),
  import('https://cdn.jsdelivr.net/npm/three-stdlib@2.29.4/+esm')
]).then(([THREE, STD]) => {
    let done = 0;
    document.querySelectorAll('canvas').forEach(cv => {
        const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
        renderer.setSize(cv.clientWidth, cv.clientHeight, false);
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xeef4fb);
        const cam = new THREE.PerspectiveCamera(40, cv.clientWidth / cv.clientHeight, 0.01, 1000);
        scene.add(new THREE.HemisphereLight(0xffffff, 0xccd8ea, 1.4));
        const dl = new THREE.DirectionalLight(0xffffff, 1.6); dl.position.set(3, 5, 4); scene.add(dl);
        new STD.GLTFLoader().load(cv.dataset.src, g => {
            const obj = g.scene;
            const bb = new THREE.Box3().setFromObject(obj);
            const size = bb.getSize(new THREE.Vector3()), c = bb.getCenter(new THREE.Vector3());
            obj.position.sub(c);
            scene.add(obj);
            const d = Math.max(size.x, size.y, size.z);
            cam.position.set(d * 0.9, d * 0.5, d * 1.1);
            cam.lookAt(0, 0, 0);
            renderer.setAnimationLoop(() => { obj.rotation.y += 0.01; renderer.render(scene, cam); });
            if (++done === 4) window.status = "ready";
        }, undefined, err => { console.error(cv.dataset.src, err); window.status = "error: " + cv.dataset.src; });
    });
}).catch(e => { window.status = "import failed: " + e.message; });
</script>
</body>
</html>
